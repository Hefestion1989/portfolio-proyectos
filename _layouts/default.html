<!doctype html>
<html lang="{{ site.lang | default: 'es-UY' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} — Damián Sebastián Gómez</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="theme-color" content="#f5f2e9">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/portfolio.css' | relative_url }}">
</head>
<body class="content-page">
  <a class="skip-link" href="#contenido">Ir al contenido</a>

  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Inicio">
      <span class="brand-mark">DS</span>
      <span>Damián Sebastián Gómez</span>
    </a>
    <nav aria-label="Navegación principal">
      <a href="{{ '/proyectos/' | relative_url }}">Proyectos</a>
      <a href="{{ '/notas/' | relative_url }}">Ensayos</a>
      <a class="nav-cta" href="https://github.com/Hefestion1989">GitHub</a>
    </nav>
  </header>

  <main id="contenido" class="content-shell">
    {{ content }}
  </main>

  <footer>
    <p>Damián Sebastián Gómez · Montevideo, Uruguay</p>
    <div>
      <a href="{{ '/' | relative_url }}">Inicio</a>
      <a href="https://github.com/Hefestion1989">GitHub</a>
    </div>
  </footer>
</body>
</html>
